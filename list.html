<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments List — Clinic System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <nav aria-label="Main Navigation">
      <a href="dashboard.html" class="logo">Clinic Portal</a>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="book.html">Book Appointment</a></li>
        <li><a href="list.html" aria-current="page">View Appointments</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <div class="card">
      <h1>Appointments List</h1>
      <p class="subtitle">Search, sort, and manage patient records.</p>

      <!-- Filter Controls -->
      <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem;">
        <div style="flex:1; min-width:200px;">
          <label for="search">Search by patient name</label>
          <input type="text" id="search" placeholder="Type name to filter...">
        </div>
        <div style="flex:1; min-width:200px;">
          <label for="dept-filter">Filter by department</label>
          <select id="dept-filter">
            <option value="">All Departments</option>
            <option value="General Medicine">General Medicine</option>
            <option value="Dental">Dental</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Pediatrics">Pediatrics</option>
          </select>
        </div>
      </div>

      <p id="counter" aria-live="polite" style="font-weight:600; color:#555;"></p>

      <!-- Accessible Table -->
      <table aria-label="Patient Appointments Table">
        <thead>
          <tr>
            <th scope="col" id="col-name" tabindex="0" role="columnheader">Patient Name ⇅</th>
            <th scope="col">Phone</th>
            <th scope="col" id="col-dept" tabindex="0" role="columnheader">Department ⇅</th>
            <th scope="col" id="col-date" tabindex="0" role="columnheader">Date ⇅</th>
            <th scope="col">Prescription</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Loaded via JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    if (!sessionStorage.getItem('isLoggedIn')) {
      window.location.href = 'login.html';
    }

    let allAppointments = [];
    let sortDirection = 1;

    // Default sample appointments if empty
    const defaultData = [
      {
        id: 1,
        patientName: "Sarah Ahmed",
        phone: "07123456789",
        department: "General Medicine",
        date: "2026-11-20",
        hasPrescription: true,
        prescriptionDetails: "Paracetamol 500mg, twice daily"
      },
      {
        id: 2,
        patientName: "Omar Khaled",
        phone: "07987654321",
        department: "Dental",
        date: "2026-11-22",
        hasPrescription: false,
        prescriptionDetails: "None"
      }
    ];

    async function loadData() {
      try {
        const res = await fetch('/api/appointments');
        if (!res.ok) throw new Error('API failed');
        allAppointments = await res.json();
      } catch (err) {
        // Fallback for offline testing
        let local = localStorage.getItem('appointments');
        if (!local) {
          localStorage.setItem('appointments', JSON.stringify(defaultData));
          allAppointments = defaultData;
        } else {
          allAppointments = JSON.parse(local);
        }
      }
      renderTable();
    }

    function renderTable() {
      const search = document.getElementById('search').value.toLowerCase();
      const dept = document.getElementById('dept-filter').value;

      const filtered = allAppointments.filter(item => {
        const matchesName = (item.patientName || '').toLowerCase().includes(search);
        const matchesDept = !dept || item.department === dept;
        return matchesName && matchesDept;
      });

      document.getElementById('counter').textContent = `Showing ${filtered.length} appointment(s)`;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem;">No matching appointments found.</td></tr>';
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.patientName}</strong></td>
          <td>${item.phone}</td>
          <td>${item.department}</td>
          <td>${item.date}</td>
          <td>${item.hasPrescription ? (item.prescriptionDetails || 'Prescribed') : 'None'}</td>
          <td>
            <button class="btn btn-danger" onclick="deleteItem(${item.id})">Cancel</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deleteItem(id) {
      if (!confirm('Are you sure you want to cancel this appointment?')) return;
      try {
        await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
      } catch (e) {}

      allAppointments = allAppointments.filter(i => i.id !== id);
      localStorage.setItem('appointments', JSON.stringify(allAppointments));
      renderTable();
    }

    // Search and filter listeners
    document.getElementById('search').addEventListener('input', renderTable);
    document.getElementById('dept-filter').addEventListener('change', renderTable);

    // Sorting
    document.getElementById('col-name').addEventListener('click', () => {
      sortDirection *= -1;
      allAppointments.sort((a,b) => (a.patientName||'').localeCompare(b.patientName||'') * sortDirection);
      renderTable();
    });

    document.getElementById('col-dept').addEventListener('click', () => {
      sortDirection *= -1;
      allAppointments.sort((a,b) => (a.department||'').localeCompare(b.department||'') * sortDirection);
      renderTable();
    });

    document.getElementById('col-date').addEventListener('click', () => {
      sortDirection *= -1;
      allAppointments.sort((a,b) => (a.date||'').localeCompare(b.date||'') * sortDirection);
      renderTable();
    });

    loadData();
  </script>
</body>
</html>
