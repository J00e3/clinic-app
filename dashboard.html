<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Clinic System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <nav aria-label="Main Navigation">
      <div class="nav-top-row">
        <a href="dashboard.html" class="logo">Clinic Portal</a>
        <div style="display:flex; gap:0.4rem; align-items:center;">
          <button type="button" id="theme-btn" class="a11y-btn" title="Toggle High Contrast / Dark Mode">🌓 Contrast</button>
          <button type="button" id="font-btn" class="a11y-btn" title="Toggle Larger Text Size">A+ Text</button>
          <button type="button" id="logout-btn" class="btn-logout">Sign Out</button>
        </div>
      </div>
      <ul>
        <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
        <li><a href="book.html">Book Appointment</a></li>
        <li><a href="list.html">View Appointments</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <div class="card">
      <h1>Receptionist Dashboard</h1>
      <p class="subtitle">Welcome to the clinic management system.</p>

      <div class="dash-grid" aria-label="Summary statistics">
        <div class="stat-box">
          <p>Total Appointments</p>
          <div class="stat-num" id="total-count">0</div>
        </div>
        <div class="stat-box">
          <p>Active Departments</p>
          <div class="stat-num" id="dept-count">5</div>
        </div>
      </div>

      <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <a href="book.html" class="btn">Book New Appointment</a>
        <a href="list.html" class="btn btn-secondary">View & Search Records</a>
      </div>
    </div>
  </main>

  <script>
    if (!sessionStorage.getItem('isLoggedIn')) {
      window.location.href = 'login.html';
    }

    const themeBtn = document.getElementById('theme-btn');
    const fontBtn = document.getElementById('font-btn');

    if (localStorage.getItem('theme_dark') === 'true') document.body.classList.add('dark-mode');
    if (localStorage.getItem('theme_large') === 'true') document.body.classList.add('large-text');

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme_dark', document.body.classList.contains('dark-mode'));
    });
    fontBtn.addEventListener('click', () => {
      document.body.classList.toggle('large-text');
      localStorage.setItem('theme_large', document.body.classList.contains('large-text'));
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    });

    const records = JSON.parse(localStorage.getItem('clinic_records') || '[]');
    document.getElementById('total-count').textContent = records.length;
  </script>
</body>
</html>
