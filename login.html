<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Clinic System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width: 420px; margin-top: 4rem;">
    <div class="card">
      <h1>Clinic Sign In</h1>
      <p class="subtitle">Please enter your staff credentials</p>

      <div id="error-box" class="alert alert-error" role="alert" aria-live="assertive"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
      </form>

      <p style="margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; text-align: center;">
        Demo login: <strong>admin</strong> / <strong>1234</strong>
      </p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var errorBox = document.getElementById('error-box');
      errorBox.style.display = 'none';

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();

      // Simulated auth (as explicitly allowed by Section 2 of the coursework brief)
      if (username === 'admin' && password === '1234') {
        sessionStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        errorBox.textContent = 'Invalid username or password. Use admin / 1234.';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
